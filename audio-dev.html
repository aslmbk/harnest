<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <title>HARNEST — audio dev</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%2319e3ff'/%3E%3C/svg%3E" />
    <style>
      :root { --bg: #070b0f; --panel: #0e161d; --line: #20313b; --text: #cfd8dc; --dim: #7c8b93; --accent: #d97757; --cyan: #19e3ff; --ok: #5dff7a; --bad: #ff5b4f; }
      * { box-sizing: border-box; }
      body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.4 ui-monospace, Consolas, monospace; }
      main { max-width: 1100px; margin: 0 auto; padding: 16px; display: grid; gap: 12px; }
      h1 { margin: 0; font-size: 18px; color: var(--accent); letter-spacing: 0.06em; }
      h2 { margin: 0 0 8px; font-size: 12px; color: var(--dim); text-transform: uppercase; letter-spacing: 0.12em; font-weight: 600; }
      section { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 12px; }
      .row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
      button { background: #13202a; color: var(--text); border: 1px solid var(--line); border-radius: 6px; padding: 6px 10px; font: inherit; cursor: pointer; }
      button:hover { border-color: var(--cyan); }
      button.on { border-color: var(--accent); color: var(--accent); }
      label { display: inline-flex; gap: 8px; align-items: center; margin-right: 16px; }
      input[type='range'] { width: 160px; accent-color: var(--accent); }
      #status { color: var(--cyan); white-space: pre-wrap; }
      #meter { height: 10px; background: #13202a; border-radius: 5px; overflow: hidden; margin-top: 8px; }
      #meter > div { height: 100%; width: 0; background: linear-gradient(90deg, var(--cyan), var(--accent)); transition: width 80ms linear; }
      table { border-collapse: collapse; width: 100%; font-size: 12px; }
      th, td { text-align: right; padding: 3px 8px; border-bottom: 1px solid var(--line); }
      th:first-child, td:first-child, th:nth-child(2), td:nth-child(2) { text-align: left; }
      .ok { color: var(--ok); } .bad { color: var(--bad); }
      .hint { color: var(--dim); font-size: 12px; }
    </style>
  </head>
  <body>
    <main id="app">
      <h1>HARNEST · procedural audio</h1>
      <p class="hint">Click anywhere first — the AudioContext starts on the first gesture, like in the game.</p>
    </main>
    <script type="module" src="/src/audio/dev/harness.ts"></script>
  </body>
</html>
