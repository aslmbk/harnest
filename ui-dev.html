<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <title>HARNEST — UI dev</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%2319e3ff'/%3E%3Crect x='3' y='5' width='4' height='4' fill='%230b1a22'/%3E%3Crect x='9' y='5' width='4' height='4' fill='%230b1a22'/%3E%3C/svg%3E" />
    <style>
      html, body { margin: 0; height: 100%; background: #05070a; overflow: hidden; }
      #backdrop { position: fixed; inset: 0; }
      #backdrop svg { display: block; width: 100%; height: 100%; }
      #ui-root { position: fixed; inset: 0; pointer-events: none; }
      #devbar {
        position: fixed; left: 8px; bottom: 8px; z-index: 10; max-width: min(560px, 70vw);
        font: 12px/1.4 'Segoe UI', system-ui, sans-serif; color: #c9d1d9;
        background: rgba(10, 14, 20, 0.92); border: 1px solid #2a3340; border-radius: 6px; padding: 4px 8px;
      }
      #devbar summary { cursor: pointer; color: #19e3ff; font-weight: 600; }
      #devbar .links { display: flex; flex-wrap: wrap; gap: 4px; margin: 6px 0; }
      #devbar a { color: #c9d1d9; text-decoration: none; padding: 1px 6px; border: 1px solid #2a3340; border-radius: 4px; }
      #devbar a:hover { border-color: #d97757; }
      #devbar a.on { background: #d97757; color: #1d0e08; border-color: #d97757; }
      #devbar p { margin: 0 0 4px; color: #8b949e; }
    </style>
  </head>
  <body>
    <div id="ui-root"></div>
    <script type="module" src="/src/ui/dev/main.ts"></script>
  </body>
</html>
